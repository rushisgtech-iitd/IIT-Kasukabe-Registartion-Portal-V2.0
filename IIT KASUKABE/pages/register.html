<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IIT Kasukabe Registration</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="register-container">

    <div class="register-box">

        <h1>🏛 IIT Kasukabe</h1>

        <h2>Official Registration Portal</h2>

        <p class="subtitle">
            Admissions Open for 2026-27
        </p>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="👤 Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="📧 Email Address"
                required
            >

            <input
                type="tel"
                id="phone"
                placeholder="📱 Phone Number"
                required
            >

            <input
                type="number"
                id="rank"
                placeholder="🏅 AIR Rank"
                required
            >

            <select id="department">

                <option value="">
                    🎓 Select Department
                </option>

                <option>Artificial Intelligence</option>

                <option>Time Travel Engineering</option>

                <option>Maggi Technology</option>

                <option>Meme Science</option>

                <option>Rocket Engineering</option>

            </select>

            <select id="category">

                <option>General</option>
                <option>OBC</option>
                <option>SC</option>
                <option>ST</option>
                <option>EWS</option>

            </select>

            <input
                type="date"
                id="dob"
            >

            <textarea
                id="reason"
                placeholder="📝 Why do you want to join IIT Kasukabe?"
                rows="4"
            ></textarea>

            <label class="checkbox">

                <input
                    type="checkbox"
                    required
                >

                I promise to eat Maggi before exams 🍜

            </label>

            <button type="submit">

                🚀 REGISTER NOW

            </button>

        </form>

    </div>

</div>

<script src="../script.js"></script>

</body>

</html>
